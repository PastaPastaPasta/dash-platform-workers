name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: npm test

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          sudo apt-get update && sudo apt-get install -y clang llvm protobuf-compiler
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.108,wasm-opt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build and check the module size
        run: scripts/build.sh

      - name: Check the whole Worker fits the Free plan (3 MiB gzipped)
        working-directory: examples/basic
        run: |
          npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/bundle" | tee "$RUNNER_TEMP/dry-run.txt"
          kib=$(sed -nE 's/.*gzip: ([0-9.]+) KiB.*/\1/p' "$RUNNER_TEMP/dry-run.txt")
          echo "gzipped upload: ${kib} KiB"
          awk -v k="$kib" 'BEGIN { exit !(k > 0 && k < 3072) }'

[package]
name = "dash-platform-workers"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dash-sdk = { git = "https://github.com/dashpay/platform", rev = "045a4b1899fd92fdd4ed771d67eb7cd5ba74da4c", default-features = false }
rs-sdk-trusted-context-provider = { git = "https://github.com/dashpay/platform", rev = "045a4b1899fd92fdd4ed771d67eb7cd5ba74da4c" }
simple-signer = { git = "https://github.com/dashpay/platform", rev = "045a4b1899fd92fdd4ed771d67eb7cd5ba74da4c", features = ["state-transitions"] }
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "0.4.58"
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1.0"
hex = "0.4"
js-sys = "0.3"
futures = "0.3"
bip37-bloom-filter = { git = "https://github.com/dashpay/rs-bip37-bloom-filter", branch = "develop" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "z"
codegen-units = 1

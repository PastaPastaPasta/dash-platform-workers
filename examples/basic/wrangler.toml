name = "dash-platform-example"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
NETWORK = "mainnet"

[observability]
enabled = true

# POST /rpc (writes included) needs a bearer token: `wrangler secret put WRITE_TOKEN`. Anyone
# holding it can spend whatever keys they send, so try it on testnet first (NETWORK = "testnet").

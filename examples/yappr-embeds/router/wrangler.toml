name = "yappr-embeds"
main = "worker.js"
compatibility_date = "2026-10-01"

# Serves /_embed/post?id=… and /_embed/user?id=…, which a redirect rule on the site's zone sends
# link-preview crawlers to (see README). Here on workers.dev, for testing, previews link to yap.pr.
[vars]
SITE_ORIGIN = "https://yap.pr"
# The social contract of the site's build (YAPPR_CONTRACT_ID in Yappr's lib/constants.ts on master).
SOCIAL_CONTRACT = "EWR695MsqPUuW8EnTbYzD4KybNQD5n7CUDWydJYNg63F"

[[services]]
binding = "CARDS"
service = "yappr-cards"

[observability]
enabled = true

# yappr.thepasta.org, the Cloudflare Pages mirror of yap.pr: `wrangler deploy --env thepasta`.
# Only /_embed/* runs a Worker; previews link to the same host.
[env.thepasta]
workers_dev = false
routes = [{ pattern = "yappr.thepasta.org/_embed/*", zone_name = "thepasta.org" }]
# Environments don't inherit vars; the mirror serves the same master build as yap.pr.
vars = { SOCIAL_CONTRACT = "EWR695MsqPUuW8EnTbYzD4KybNQD5n7CUDWydJYNg63F" }

[[env.thepasta.services]]
binding = "CARDS"
service = "yappr-cards"

[env.thepasta.observability]
enabled = true

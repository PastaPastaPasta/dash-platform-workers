name = "yappr-embeds"
main = "worker.js"
compatibility_date = "2026-10-01"

# On Yappr's zone: drop ORIGIN and add
#   routes = [{ pattern = "yap.pr/post*", zone_name = "yap.pr" }, { pattern = "yap.pr/user*", zone_name = "yap.pr" }]
# With ORIGIN set (as here, on workers.dev) it serves the live site from anywhere, for testing.
# Set the route's failure mode to "fail open" so the site stays up if this Worker can't run.
[vars]
ORIGIN = "https://yap.pr"
CANONICAL_ORIGIN = "https://yap.pr"
# The social contract of the site's build (YAPPR_CONTRACT_ID in Yappr's lib/constants.ts on master).
SOCIAL_CONTRACT = "EWR695MsqPUuW8EnTbYzD4KybNQD5n7CUDWydJYNg63F"

[[services]]
binding = "CARDS"
service = "yappr-cards"

[observability]
enabled = true

# yappr.thepasta.org: the Cloudflare Pages mirror of yap.pr, on a zone in this account.
# `wrangler deploy --env thepasta`
[env.thepasta]
workers_dev = false
routes = [
  { pattern = "yappr.thepasta.org/post*", zone_name = "thepasta.org" },
  { pattern = "yappr.thepasta.org/user*", zone_name = "thepasta.org" },
]
# Environments don't inherit vars; the mirror serves the same master build as yap.pr.
vars = { SOCIAL_CONTRACT = "EWR695MsqPUuW8EnTbYzD4KybNQD5n7CUDWydJYNg63F" }

[[env.thepasta.services]]
binding = "CARDS"
service = "yappr-cards"

[env.thepasta.observability]
enabled = true

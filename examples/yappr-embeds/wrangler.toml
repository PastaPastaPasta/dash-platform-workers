name = "yappr-embeds"
main = "worker.js"
compatibility_date = "2026-10-01"

# On Yappr's zone, route `yap.pr/post/*` and `yap.pr/user/*` here and drop ORIGIN: the Worker
# then fetches the same URL, which Cloudflare sends to the origin. ORIGIN lets the Worker run
# anywhere else (workers.dev) in front of the live site, for testing.
[vars]
NETWORK = "testnet"
ORIGIN = "https://yap.pr"
CANONICAL_ORIGIN = "https://yap.pr"
SOCIAL_CONTRACT = "9oDC6xdg8WRixTD2j3FCBq3vtsrf6bRGjXSJbhtFoma9"
PROFILE_CONTRACT = "FZSnZdKsLAuWxE7iZJq12eEz6xfGTgKPxK7uZJapTQxe"

[observability]
enabled = true
